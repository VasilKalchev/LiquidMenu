name: Compile examples

on:
  push:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "examples/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "examples/**"
      - "src/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-avr-parallel-examples:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        fqbn:
          - arduino:avr:uno
          - arduino:avr:nano
#           - arduino:avr:leonardo
#           - arduino:avr:mega:cpu=atmega2560

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}

          enable-deltas-report: true
          enable-warnings-report: true

          cli-compile-flags: |
            - --build-property
            - build.extra_flags=-DDisplayClass=LiquidCrystal -DLIQUIDMENU_LIBRARY=1
          sketch-paths: |
            - ./examples/Arduino/A_hello_menu
            - ./examples/Arduino/B_serial_menu
            - ./examples/Arduino/C_buttons_menu
            - ./examples/Arduino/D_encoder_menu
            - ./examples/Arduino/E_focus_menu
            - ./examples/Arduino/F_glyph_menu
            - ./examples/Arduino/G_scrolling_menu
            - ./examples/Arduino/H_getters_menu
            - ./examples/Arduino/I_progmem_menu
            - ./examples/Arduino/J_dynamic_menu
            - ./examples/Arduino/K_system_menu
          libraries: |
            - source-path: ./
            - name: LiquidCrystal

      - name: Report
        uses: actions/upload-artifact@v4
        with:
          name: sketches-reports-avr-${{ strategy.job-index }}
          path: sketches-reports

  compile-avr-i2c-examples:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        fqbn:
          - arduino:avr:uno

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}

          enable-deltas-report: true
          enable-warnings-report: true

          cli-compile-flags: |
            - --build-property
            - build.extra_flags=-DDisplayClass=LiquidCrystal_I2C -DLIQUIDMENU_LIBRARY=2
          sketch-paths: |
            - ./examples/Arduino/L_I2C_menu
          libraries: |
            - source-path: ./
            - source-url: https://github.com/johnrickman/LiquidCrystal_I2C.git
            - name: LiquidCrystal

      - name: Report
        uses: actions/upload-artifact@v4
        with:
          name: sketches-reports-avr-i2c
          path: sketches-reports

  compile-esp32-parallel-examples:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        fqbn:
          - esp32:esp32:esp32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}

          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

          enable-deltas-report: true
          enable-warnings-report: true

          cli-compile-flags: |
            - --build-property
            - build.extra_flags=-DDisplayClass=LiquidCrystal -DLIQUIDMENU_LIBRARY=1
          sketch-paths: |
            - ./examples/ESP32/A_hello_menu
          libraries: |
            - source-path: ./
            - name: LiquidCrystal

      - name: Report
        uses: actions/upload-artifact@v4
        with:
          name: sketches-reports-esp32
          path: sketches-reports

  compile-esp32-i2c-examples:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        fqbn:
          - esp32:esp32:esp32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}

          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

          enable-deltas-report: true
          enable-warnings-report: true

          cli-compile-flags: |
            - --build-property
            - build.extra_flags=-DDisplayClass=LiquidCrystal_I2C -DLIQUIDMENU_LIBRARY=2
          sketch-paths: |
            - ./examples/ESP32/B_I2C_menu
            - ./examples/ESP32/C_buttons_menu
            - ./examples/ESP32/D_system_menu
          libraries: |
            - source-path: ./
            - source-url: https://github.com/johnrickman/LiquidCrystal_I2C.git
            - name: LiquidCrystal

      - name: Report
        uses: actions/upload-artifact@v4
        with:
          name: sketches-reports-esp32-i2c
          path: sketches-reports

  merge-reports:
    needs:
      - compile-avr-parallel-examples
      - compile-avr-i2c-examples
      - compile-esp32-parallel-examples
      - compile-esp32-i2c-examples
    runs-on: ubuntu-latest

    steps:
      - name: Merge reports
        uses: actions/upload-artifact/merge@v4
        with:
          name: sketches-reports
          pattern: sketches-reports-*
          delete-merged: true
