name: Arduino lint

on:
  push:
    paths:
      - ".github/workflows/arduino-lint.yml"
      - "examples/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/arduino-lint.yml"
      - "examples/**"
      - "src/**"
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint
        uses: arduino/arduino-lint-action@v1
        with:
          library-manager: update
          compliance: strict
